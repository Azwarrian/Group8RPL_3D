<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layanan Pelaporan Fasilitas Rusak</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--nv:#123a52;--bg:#1d77ae;--card:#69b3d0;--pill:#3f9fd3;--ink:#0c2a3b;--cy:#00c0e8;--gr:#2bc45a;--rd:#ff4b4b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1d2a;font-family:Nunito,system-ui,sans-serif;color:#fff}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit}
.phone{width:min(100%,400px);height:min(100dvh,820px);margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:420px){body{display:grid;place-items:center}.phone{border-radius:28px;box-shadow:0 20px 60px #0008}}
#hd{background:var(--nv);padding:12px 16px;display:flex;align-items:center;gap:10px}
#hd small{display:block;font-size:10px;opacity:.7}
#ttl{font-family:'Lilita One',sans-serif;font-size:19px;letter-spacing:.3px}
#bk{background:var(--pill);border:0;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px}
#v{flex:1;overflow:auto;padding:18px}
section{display:flex;flex-direction:column;gap:12px;min-height:100%}
section.mid{justify-content:center}
h1,h2{font-family:'Lilita One',sans-serif;font-weight:400;margin:0;text-align:center}
h1{font-size:26px}h2{font-size:21px}
p{margin:0}.mut{font-size:12px;opacity:.85;text-align:center}
.pill{background:var(--pill);border:2px solid #9fd8f0;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;text-align:center;width:100%}
.pill:hover{filter:brightness(1.1)}
.pill.dk{background:var(--nv);border-color:var(--nv)}
.pill.rd{background:var(--rd);border-color:var(--rd)}
.pill.sm{width:auto;padding:7px 14px;font-size:13px}
.box{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
label{font-size:12px;font-weight:800;color:var(--ink)}
input,textarea,select{width:100%;border:0;border-radius:10px;padding:10px 12px;background:#e8f6fc;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #fff}
.role{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;font-family:'Lilita One',sans-serif;font-size:20px;cursor:pointer;border:3px solid transparent;color:#fff;background:var(--cy)}
.role.a{background:var(--gr)}.role.on{border-color:#fff;box-shadow:0 0 0 3px #fff4}
.av{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.big{width:84px;height:84px;font-size:46px;margin:auto}
.ok{width:96px;height:96px;border-radius:50%;background:#2ecc71;display:grid;place-items:center;font-size:56px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);color:var(--ink);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;font-weight:800}
.stats b{display:block;font-family:'Lilita One',sans-serif;font-size:24px;font-weight:400}
.tabs{display:flex;gap:6px}.tabs button{flex:1;border:0;border-radius:10px;padding:8px;font-weight:800;cursor:pointer;background:#9fd8f0;color:var(--ink)}
.tabs .on{background:var(--nv);color:#fff}
.up{border:2px dashed var(--nv);border-radius:14px;min-height:130px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#e8f6fc;color:var(--ink);overflow:hidden;font-size:13px}
.up img{width:100%;max-height:200px;object-fit:cover;display:block}
.ring{--p:0;width:64px;height:64px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--gr) calc(var(--p)*1%),#cfe7f1 0)}
.ring i{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;background:var(--card);color:var(--ink)}
.chips .on{background:var(--nv);color:#fff}
.it{background:var(--card);color:var(--ink);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;text-align:left;border:0;width:100%}
.it b{display:block}.it span{font-size:12px}
.bd{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;color:#fff;background:#e0a100;white-space:nowrap}
.bd.Diproses{background:#2f6fe0}.bd.Selesai{background:#1f9d55}
.dt{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;font-size:13px}.dt dt{font-weight:800}.dt dd{margin:0}
#nav{background:var(--nv);display:flex;justify-content:space-around;padding:10px 10px max(10px,env(safe-area-inset-bottom));font-size:12px;font-weight:800}
#nav .on{background:var(--pill)}
#nav button{background:none;border:0;color:#fff;cursor:pointer;padding:4px 14px;border-radius:8px}
#nav .out{color:#ff8080}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;opacity:.9}
@media(max-width:899px){#nav.sub{display:none}}
@media(min-width:600px) and (max-width:899px){.phone{width:520px}}
@media(min-width:900px){
  body{display:block}
  .phone{width:100%;height:100dvh;margin:0;border-radius:0;box-shadow:none}
  .phone.in{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .in #hd{grid-column:1/-1;padding:14px 28px}
  .in #nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 14px;font-size:15px}
  .in #nav button{text-align:left;width:100%;padding:12px 14px}
  .in #nav .out{margin-top:auto}
  .in #v{grid-column:2;grid-row:2}
  #v{padding:32px}
  #ttl{font-size:22px}
  h1{font-size:32px}
  section{width:100%;margin-inline:auto;max-width:1000px}
  section.mid{max-width:440px}
  #form,#detail{max-width:680px}
  #hb{flex-direction:row!important}
  #hb .pill{padding:22px;font-size:17px}
  .stats{gap:14px}.stats div{padding:18px 8px;font-size:13px}.stats b{font-size:34px}
  #items{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="phone">
<header id="hd" hidden><button id="bk" aria-label="Kembali">←</button><div><small>Layanan Pelaporan</small><div id="ttl"></div></div></header>
<div id="v">

<section id="role" class="mid">
  <h1>Layanan Pelaporan<br>Fasilitas Rusak</h1>
  <p class="mut">Masuk sebagai siapa?</p>
  <div class="role" data-r="user" tabindex="0"><span class="av">🧑</span>USER</div>
  <div class="role a" data-r="admin" tabindex="0"><span class="av">🧑‍💼</span>ADMIN</div>
  <button class="pill dk" data-go="login">Login</button>
  <button class="pill" data-go="register">Register</button>
</section>

<section id="login" class="mid">
  <h2 id="lt">Login</h2>
  <div class="box">
    <label for="ln">Nama</label><input id="ln" autocomplete="username">
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password">
    <button class="pill dk" id="doLogin">LOGIN</button>
    <p class="mut" style="color:var(--ink)">Admin demo: admin / admin123</p>
  </div>
  <button class="pill sm" style="align-self:center" data-go="register">Belum punya akun? Register</button>
  <button class="pill sm dk" style="align-self:center" data-go="role">Ganti peran</button>
</section>

<section id="register" class="mid">
  <h2>Register</h2>
  <div class="box">
    <label for="rn">Nama</label><input id="rn" autocomplete="username">
    <label for="rp">Password (min. 4 karakter)</label><input id="rp" type="password" autocomplete="new-password">
    <button class="pill dk" id="doReg">SIGN UP</button>
  </div>
  <button class="pill sm" style="align-self:center" data-go="login">Sudah punya akun? Login</button>
</section>

<section id="success" class="mid">
  <div class="ok">✓</div><h1>SUCCESSFUL</h1>
  <p class="mut">Akun berhasil dibuat. Silakan login.</p>
  <button class="pill dk" data-go="login">Ke halaman login</button>
</section>

<section id="home">
  <h1 id="hi" style="text-align:left"></h1>
  <p id="sub" class="mut" style="text-align:left"></p>
  <div class="stats" id="stats"></div>
  <div id="hb" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section id="form">
  <div class="tabs"><button class="on" data-t="0">Informasi</button><button data-t="1">Foto</button></div>
  <div class="box" id="t0">
    <label for="fn">Nama barang</label><input id="fn" placeholder="Contoh: Proyektor">
    <label for="fl">Lokasi barang</label><input id="fl" placeholder="Contoh: Ruang 3.2">
    <label for="fd">Tanggal kerusakan</label><input id="fd" type="date">
    <label for="fk">Deskripsi kerusakan</label><textarea id="fk"></textarea>
    <button class="pill dk" data-t="1">Lanjut ke foto</button>
  </div>
  <div class="box" id="t1" hidden>
    <label>Foto barang</label>
    <label class="up" id="up" for="ff"><span id="upt">📤<br>Ketuk untuk unggah foto</span></label>
    <input id="ff" type="file" accept="image/*" hidden>
    <div class="ring" id="ring" hidden><i id="rt">0%</i></div>
    <button class="pill dk" id="send">Kirim</button>
  </div>
</section>

<section id="done" class="mid">
  <div class="ok">✓</div><h1>Laporan terkirim</h1>
  <p class="mut">Laporan Anda akan segera ditindaklanjuti.</p>
  <button class="pill dk" data-go="home">Beranda</button>
  <button class="pill" data-go="list">Lihat riwayat</button>
</section>

<section id="list">
  <div class="chips" id="chips"></div>
  <div id="items" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section id="detail">
  <div class="box" id="dbox"></div>
</section>

<section id="profile" class="mid">
  <div class="box" style="align-items:center;text-align:center">
    <h2>PROFIL</h2><div class="av big" id="pav"></div>
    <b id="pn" style="font-size:20px"></b><span id="pr" class="bd"></span>
  </div>
  <button class="pill dk" data-go="list">Riwayat laporan</button>
  <button class="pill rd" id="lo2">Logout</button>
</section>

</div>
<nav id="nav" hidden><button data-go="home">🏠 Home</button><button data-go="profile">👤 Profil</button><button class="out" id="lo">Logout</button></nav>
<div id="toast" hidden></div>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Penyimpanan penuh, foto terlalu besar.')}};
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ST=['Menunggu','Diproses','Selesai'];
const T={home:'Beranda',form:'Pelaporan Kerusakan',list:'Laporan',detail:'Detail Laporan',profile:'Profil'};
const B={form:'home',list:'home',detail:'list',profile:'home'},N=['home','list','profile'];
let users=L('users',[{name:'admin',pw:'admin123',role:'admin'}]),reps=L('reps',[]),sess=L('sess',null);
let role='user',cur='role',sel=null,filt='Semua',foto='';

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2500)}
function go(id){
  cur=id;$$('#v section').forEach(s=>s.hidden=s.id!==id);
  $('#hd').hidden=!T[id];$('#ttl').textContent=T[id]||'';$('#bk').hidden=!B[id];$('#nav').hidden=!T[id];$('#nav').classList.toggle('sub',!N.includes(id));$('.phone').classList.toggle('in',!!T[id]);
  $$('#nav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===id||(id==='detail'&&b.dataset.go==='list')));
  ({role:rRole,login:rLogin,home:rHome,form:rForm,list:rList,detail:rDetail,profile:rProfile}[id]||(()=>{}))();
  $('#v').scrollTop=0;
}
const mine=()=>sess.role==='admin'?reps:reps.filter(r=>r.user===sess.name);
const isAdmin=()=>sess&&sess.role==='admin';

function rRole(){$$('.role').forEach(r=>r.classList.toggle('on',r.dataset.r===role))}
function rLogin(){$('#lt').textContent='Login '+(role==='admin'?'Admin':'User')}
function rHome(){
  $('#hi').textContent='Halo '+sess.name+' 👋';
  $('#sub').textContent=isAdmin()?'Kelola laporan kerusakan fasilitas':'Layanan Pelaporan Fasilitas Rusak';
  const m=mine();
  $('#stats').innerHTML=ST.map(s=>`<div><b>${m.filter(r=>r.status===s).length}</b>${s}</div>`).join('');
  $('#hb').innerHTML=(isAdmin()?'':'<button class="pill" data-go="form">Pelaporan Kerusakan</button>')+
    `<button class="pill ${isAdmin()?'':'dk'}" data-go="list">${isAdmin()?'Daftar Laporan Masuk':'Riwayat Laporan'}</button>`;
}
function rForm(){tab(0);['fn','fl','fk'].forEach(i=>$('#'+i).value='');$('#fd').value=new Date().toISOString().slice(0,10);resetFoto()}
function resetFoto(){foto='';$('#ff').value='';$('#upt').innerHTML='📤<br>Ketuk untuk unggah foto';$('#ring').hidden=true;$('#up').querySelector('img')?.remove();$('#upt').hidden=false}
function tab(n){$$('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===n));$('#t0').hidden=n!==0;$('#t1').hidden=n!==1}
function rList(){
  $('#chips').innerHTML=['Semua',...ST].map(s=>`<button class="${s===filt?'on':''}" data-f="${s}">${s}</button>`).join('');
  const m=mine().filter(r=>filt==='Semua'||r.status===filt).slice().reverse();
  $('#items').innerHTML=m.length?m.map(r=>`<button class="it" data-id="${r.id}"><div><b>${E(r.nama)}</b><span>${E(r.lokasi)} · ${r.tgl}${isAdmin()?' · '+E(r.user):''}</span></div><span class="bd ${r.status}">${r.status}</span></button>`).join(''):'<p class="empty">Belum ada laporan.</p>';
}
function rDetail(){
  const r=reps.find(x=>x.id===sel);if(!r)return go('list');
  $('#dbox').innerHTML=(r.foto?`<img src="${r.foto}" alt="Foto ${E(r.nama)}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover">`:'')+
  `<dl class="dt"><dt>Barang</dt><dd>${E(r.nama)}</dd><dt>Lokasi</dt><dd>${E(r.lokasi)}</dd><dt>Tanggal</dt><dd>${r.tgl}</dd><dt>Pelapor</dt><dd>${E(r.user)}</dd><dt>Deskripsi</dt><dd>${E(r.desk||'-')}</dd><dt>Status</dt><dd><span class="bd ${r.status}">${r.status}</span></dd></dl>`+
  (isAdmin()?`<label for="ns">Ubah status pemeliharaan</label><select id="ns">${ST.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><button class="pill dk" id="svS">Simpan status</button>`:'')+
  (isAdmin()||r.status==='Menunggu'?'<button class="pill rd" id="del">Hapus laporan</button>':'');
}
function rProfile(){$('#pav').textContent=isAdmin()?'🧑‍💼':'🧑';$('#pn').textContent=sess.name;$('#pr').textContent=sess.role.toUpperCase()}
function logout(){sess=null;S('sess',null);role='user';go('role')}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  const r=e.target.closest('.role');if(r){role=r.dataset.r;return rRole()}
  const t=e.target.closest('[data-t]');if(t)return tab(+t.dataset.t);
  const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;return rList()}
  const i=e.target.closest('[data-id]');if(i){sel=+i.dataset.id;return go('detail')}
});
$('#bk').onclick=()=>go(B[cur]);
$('#lo').onclick=$('#lo2').onclick=logout;
$$('.role').forEach(r=>r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.click()}});

$('#doLogin').onclick=()=>{
  const n=$('#ln').value.trim(),p=$('#lp').value;
  const u=users.find(x=>x.name.toLowerCase()===n.toLowerCase()&&x.pw===p&&x.role===role);
  if(!u)return toast('Nama, password, atau peran tidak cocok.');
  sess=u;S('sess',u);$('#lp').value='';go('home');
};
$('#doReg').onclick=()=>{
  const n=$('#rn').value.trim(),p=$('#rp').value;
  if(!n||p.length<4)return toast('Isi nama dan password minimal 4 karakter.');
  if(users.some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast('Nama sudah terdaftar.');
  users.push({name:n,pw:p,role});S('users',users);$('#rn').value=$('#rp').value='';go('success');
};

$('#ff').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  if(!file.type.startsWith('image/'))return toast('File harus berupa gambar.');
  const ring=$('#ring');ring.hidden=false;let p=0;
  const iv=setInterval(()=>{p=Math.min(p+8,100);ring.style.setProperty('--p',p);$('#rt').textContent=p+'%';if(p>=100)clearInterval(iv)},80);
  const img=new Image();
  img.onload=()=>{
    const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    foto=c.toDataURL('image/jpeg',.6);
    $('#upt').hidden=true;$('#up').querySelector('img')?.remove();
    const im=document.createElement('img');im.src=foto;im.alt='Pratinjau foto';$('#up').appendChild(im);
  };
  img.src=URL.createObjectURL(file);
};
$('#send').onclick=()=>{
  const nama=$('#fn').value.trim(),lokasi=$('#fl').value.trim(),tgl=$('#fd').value;
  if(!nama||!lokasi||!tgl){tab(0);return toast('Nama barang, lokasi, dan tanggal wajib diisi.')}
  if(!foto)return toast('Unggah foto kerusakan dulu.');
  reps.push({id:Date.now(),user:sess.name,nama,lokasi,tgl,desk:$('#fk').value.trim(),foto,status:'Menunggu'});
  S('reps',reps);go('done');
};
$('#dbox').addEventListener('click',e=>{
  const r=reps.find(x=>x.id===sel);if(!r)return;
  if(e.target.id==='svS'){r.status=$('#ns').value;S('reps',reps);toast('Status diperbarui.');rDetail()}
  if(e.target.id==='del'&&confirm('Hapus laporan ini?')){reps=reps.filter(x=>x.id!==sel);S('reps',reps);toast('Laporan dihapus.');go('list')}
});

S('users',users);
sess?(role=sess.role,go('home')):go('role');
</script>
</body>
</html>
